name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/avanza-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Test release commit
        run: uv run --locked pytest tests/unit -v

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run --locked python -c "import os; from avanza_mcp import __version__; assert os.environ['GITHUB_REF_NAME'] == f'v{__version__}'"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
