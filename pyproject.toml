[project]
name = "avanza-mcp"
dynamic = ["version"]
description = "MCP server for Avanza public market data API - Swedish stocks, funds, and more"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.5",
    "httpx>=0.28.1,<1.0",
    "httpx-sse>=0.4.3",
    "keyring>=25.7,<26.0",
    "pydantic>=2.14.2",
    "qrcode>=8.2,<9.0",
    "tenacity>=9.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
]

[project.scripts]
avanza-mcp = "avanza_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avanza_mcp"]

[tool.hatch.version]
path = "src/avanza_mcp/__init__.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (may hit real APIs)",
]
